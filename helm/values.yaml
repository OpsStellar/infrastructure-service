# Helm values for infrastructure-service

replicaCount: 1

image:
  repository: opsstellardevacr.azurecr.io/infrastructure-service
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: acr-secret

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8030
  targetPort: 8030

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

env:
  - name: SERVICE_NAME
    value: "infrastructure-service"
  - name: SERVICE_PORT
    value: "8030"
  - name: LOG_LEVEL
    value: "INFO"
  - name: DATABASE_URL
    value: "postgresql://opsstellar_user:opsstellar_password@postgres:5432/opsstellar"
  - name: REDIS_URL
    value: "redis://redis:6379"
  - name: CORS_ORIGINS
    value: '["http://localhost:5174","http://localhost:5173","http://localhost:3000"]'
  - name: SETTINGS_SERVICE_URL
    value: "http://settings-service:8020"
  - name: AUTH_SERVICE_URL
    value: "http://auth-service:8001"
  - name: DRIFT_CHECK_INTERVAL
    value: "3600"
  - name: MAX_STATE_FILE_VERSIONS
    value: "10"
  - name: OTLP_ENDPOINT
    value: "http://apm-service:8016/v1/traces"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://apm-service:8016"

# Dependencies: postgres (healthy), db-service (completed), redis (healthy), settings-service (healthy)

namespace: default
