apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.nameOverride | default "infrastructure-service" }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.nameOverride | default "infrastructure-service" }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ .Values.nameOverride | default "infrastructure-service" }}
